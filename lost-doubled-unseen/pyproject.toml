[project]
name = "lost-doubled-unseen-demo"
version = "0"
description = "Runnable demo for the blog series Lost, doubled, unseen."
requires-python = ">=3.14"
dependencies = [
    "grelmicro[fastapi,postgres,opentelemetry]>=0.44.2",
    "fastapi[standard]>=0.138",
    "aiosmtplib>=4",
]

[dependency-groups]
dev = ["pytest", "httpx", "aiosmtpd", "ruff", "ty"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 68  # the posts show this code on phones

[tool.ruff.lint]
select = ["F", "E", "I", "UP", "B"]

[tool.ty.environment]
extra-paths = ["steps"]

[tool.ruff.lint.per-file-ignores]
"steps/db.py" = ["E501"]  # helpers the posts never show
